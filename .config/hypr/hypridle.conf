general {
    lock_cmd = pidof hyprlock || hyprlock # never a second hyprlock instance
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # else the first keypress only wakes the display
    on_unlock_cmd = pkill -SIGUSR2 waybar # waybar stacks on wake otherwise
}

listener {
    timeout = 150 # 2.5 min
    on-timeout = brightnessctl -s set 10 # dim; -s saves the level for -r below
    on-resume = brightnessctl -r
}

listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
