<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- generic families resolve to Geist; Noto fills emoji and non-Latin glyphs -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Geist</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Geist</family><family>Noto Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Geist</family><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>GeistMono Nerd Font Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
